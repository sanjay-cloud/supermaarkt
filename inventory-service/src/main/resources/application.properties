spring.application.name=inventory-service

#api-props
server.servlet.context-path=/api/v1

# db-properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/supermaarkt?currentSchema=app}
spring.datasource.username=maarkt_admin
spring.datasource.password=Postgressan@8
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mongodb.host=${DOCKER_MONGO_HOST:localhost}
spring.mongodb.port=${DOCKER_MONGO_PORT:27017}
spring.mongodb.database=supermaarkt

spring.kafka.bootstrap-servers={SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092}
spring.kafka.consumer.group-id=supermaarkt-group