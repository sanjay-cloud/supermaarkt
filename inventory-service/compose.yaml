# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
    ports:
      - 8080:8080
    environment:
    # Inject Docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/supermaarkt?currentSchema=app
      - DOCKER_MONGO_HOST=localhost
      - DOCKER_MONGO_PORT=27017
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_started
      kafka-broker:
        condition: service_started    

  postgres-db:
    image: postgres:latest
    environment:
      POSTGRES_DB: supermaarkt
      POSTGRES_USER:  maarkt_admin
      POSTGRES_PASSWORD: Postgressan@8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maarkt_admin -d supermaarkt"]
      interval: 5s
      timeout: 5s
      retries: 10  

  mongo-db:
    image: mongo:latest

  kafka-broker:
    image: apache/kafka:latest
    container_name: kafka-broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller      
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSET_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

